# Cache policy by content type. It lives in a map rather than in per-location
# `add_header` blocks on purpose: nginx drops every inherited `add_header` as
# soon as a block declares one of its own, so a cache header in a location
# would silently strip the security headers below from exactly the files that
# need them most. One level, no inheritance to lose.
map $sent_http_content_type $cache_policy {
  default                "no-cache";
  text/css               "public, max-age=3600";
  application/javascript "public, max-age=3600";
  image/png              "public, max-age=3600";
  image/svg+xml          "public, max-age=3600";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Coolify's proxy terminates TLS and owns HSTS in front of this container, so
  # nothing here redirects or claims a scheme it cannot see.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  # The page loads only its own CSS, JS and images: no CDN, no webfont, no
  # analytics. Keep it that way and this header never needs an exception.
  add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header Cache-Control $cache_policy always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml;
  gzip_min_length 512;

  location / {
    try_files $uri $uri/ =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}

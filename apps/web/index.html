<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Companion</title>
    <!-- Default mark-tile favicon (docs/brand); the SPA swaps in the instance
         logo once branding loads (lib/auth.tsx). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2309090b'/%3E%3Cg transform='translate(16 16) scale(.8) translate(-16 -16)'%3E%3Cpath d='M23.16 9.57A10 10 0 1 0 23.16 22.43' fill='none' stroke='%23ffffff' stroke-width='3.2' stroke-linecap='round'/%3E%3Ccircle cx='25.4' cy='16' r='2.6' fill='%23ffffff'/%3E%3C/g%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Companion — a self-hosted engineering dashboard that turns ideas into reviewed plans, tasks, and GitHub work with AI agents."
    />
    <!-- A private, self-hosted tool: never index it. -->
    <meta name="robots" content="noindex" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <!-- Link previews (Slack, chat apps). The card describes the product, not
         the instance: scrapers do not run JS, so they never see the branding
         the SPA swaps in, and an instance logo is customer data we would not
         want in a preview anyway. The image path is relative because a
         self-hosted instance has no origin we can know at build time. -->
    <meta property="og:title" content="Companion" />
    <meta property="og:site_name" content="Companion" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Self-hosted engineering dashboard: ideas, specifications, documentation, tasks, issues, PRs, and pipelines — operated by AI agents."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Companion" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the stored theme before first paint so there is no flash.
      (function () {
        var t = localStorage.getItem('companion.theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<!--
  Source for apps/web/public/og.png. Regenerate after editing:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
    --screenshot=apps/web/public/og.png --window-size=1200,630 \
    --hide-scrollbars file://$PWD/docs/brand/og.html

  The horizontal lockup at the proportions in docs/brand/README.md: gap is
  0.33 and wordmark cap height 0.60 of the mark. Set in system-ui, the same
  face the app renders in, until the wordmark ships as a real font file.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #09090b;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 40px;
        padding: 0 96px;
      }
      /* The 32 viewBox carries ~12% empty margin, so the CSS gap is the spec
         gap minus that, measured off the drawn mark and not off the box. */
      .lockup { display: flex; align-items: center; gap: 12px; }
      .lockup svg { width: 96px; height: 96px; }
      .wordmark { font-size: 68px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
      .desc { font-size: 31px; line-height: 1.4; color: #a1a1aa; max-width: 800px; letter-spacing: -0.01em; }
      .rule { height: 1px; background: #27272a; }
      .foot {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 17px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #52525b;
      }
    </style>
  </head>
  <body>
    <div class="lockup">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M23.16 9.57A10 10 0 1 0 23.16 22.43" stroke="#fafafa" stroke-width="3.2" stroke-linecap="round" />
        <circle cx="25.4" cy="16" r="2.6" fill="#fafafa" />
      </svg>
      <span class="wordmark">Companion</span>
    </div>
    <p class="desc">A self-hosted engineering dashboard, operated by AI agents.</p>
    <div class="rule"></div>
    <span class="foot">Proposals · Issues · Pull requests · Pipelines · Agent runs</span>
  </body>
</html>

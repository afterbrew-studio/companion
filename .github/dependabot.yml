version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    # Keep routine updates compact, but never hide unrelated major migrations
    # in one PR. Coupled toolchains stay together; every other major remains an
    # individual decision. Security updates are unaffected by these groups.
    open-pull-requests-limit: 6
    groups:
      react-toolchain:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      vite-toolchain:
        applies-to: version-updates
        patterns:
          - vite
          - "@vitejs/plugin-react"
      moxxy-toolchain:
        applies-to: version-updates
        patterns:
          - "@moxxy/*"
      production-minor-and-patch:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - "@moxxy/*"
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - esbuild
        update-types:
          - minor
          - patch
    ignore:
      # Runtime declarations follow the supported Node LTS, not the newest
      # Current release. Upgrade these together with the production image.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Moxxy SDK 0.36 still peers on Zod 3; a Zod 4 PR cannot be correct until
      # that boundary moves or Companion adds an explicit compatibility seam.
      - dependency-name: zod
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 1
    groups:
      container-images:
        applies-to: version-updates
        patterns:
          - "*"
    # Runtime majors are deployment migrations, not unattended image refreshes.
    ignore:
      - dependency-name: node
        update-types:
          - "version-update:semver-major"

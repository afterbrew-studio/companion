name: Publish

# Publishes on a landed change, not on a tag: main is the release branch, and a
# version bump in package.json is the signal. Every other push is a no-op.
on:
  push:
    branches: [main]
  # Same job, on demand, for a republish after a failed run.
  workflow_dispatch:

# npm trusted publishing mints a short-lived OIDC token instead of holding a
# long-lived NPM_TOKEN in repository secrets; `id-token: write` is what allows
# it, and provenance is attached automatically as a result.
permissions:
  contents: read
  id-token: write

# Two runs publishing the same version would race to the same registry entry.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # One package failing must not cancel the other: they version independently
      # and a broken runner release should not hold back the CLI.
      fail-fast: false
      matrix:
        include:
          - dir: apps/companion-cli
            package: '@moxxy/companion'
          - dir: apps/companion-runner
            package: '@moxxy/companion-runner'
          # The module ABI. Ordered so a dependency publishes before anything
          # that declares it: an out-of-tree module resolves types through this
          # whole chain, not just through the SDK.
          - dir: packages/types
            package: '@moxxy/companion-types'
          - dir: packages/services
            package: '@moxxy/companion-services'
          - dir: packages/contracts
            package: '@moxxy/companion-contracts'
          - dir: packages/core
            package: '@moxxy/companion-core'
          - dir: packages/ui
            package: '@moxxy/companion-ui'
          - dir: packages/sdk
            package: '@moxxy/companion-sdk'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing needs npm 11.5.1 or newer; the npm bundled with
      # Node 22 predates it and fails with an authentication error that says
      # nothing about versions.
      - run: npm install -g npm@latest

      # Both packages' prepublishOnly scripts drive the pnpm workspace
      # (typecheck, bundle, tests), so the workspace has to be installed even
      # though npm does the publishing.
      - run: pnpm install --frozen-lockfile

      # And BUILT. The CLI's typecheck resolves `@companion/module-core/contract`
      # through that package's dist, which does not exist after a bare install:
      # the first real run failed with a wall of "Cannot find module" and
      # implicit-any errors that were all the same missing build.
      - run: pnpm build

      - name: Publish ${{ matrix.package }} if its version is new
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # `npm view` fails for a package that has never been published, which
          # is also a reason to publish, so only a successful lookup is a skip.
          if npm view "${{ matrix.package }}@$version" version >/dev/null 2>&1; then
            echo "${{ matrix.package }}@$version is already on the registry; nothing to publish."
            exit 0
          fi
          echo "Publishing ${{ matrix.package }}@$version"
          # Packed by pnpm, published by npm, and both halves are load-bearing.
          # `npm pack` leaves `workspace:*` literal, so the tarball installs
          # nowhere; pnpm rewrites it to the resolved version. Trusted publishing
          # is an npm CLI feature, so npm uploads pnpm's tarball.
          pnpm pack --pack-destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP"/*.tgz

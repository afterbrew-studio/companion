name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The module registries are generated from profiles/*.json and gitignored.
      # Build before typecheck (topological order: @companion/contract emits its
      # types before api/web typecheck against them).
      # Build the FULL profile first: it is the superset, so every module's code
      # is compiled and every dist/ the later steps need exists.
      - run: pnpm gen:modules --profile full
      - run: pnpm -r build
      - run: pnpm -r typecheck

      # Framework + module tests. `packages/core` and `packages/services` cover
      # the logic with no daemon to drive it: the RBAC fold ordering, the licence
      # gate's fail-closed paths and the single-instance lock. Each of those was
      # verified by hand once; the tests are what keep it verified.
      - run: pnpm -r test

      # RBAC gate: the three permission declaration sites must agree, ids must
      # be unique across modules, and any change to the effective grid must be
      # reflected in docs/acl-grid.json so it shows up in review. Needs dist/,
      # so it runs after the build.
      - run: pnpm acl check

      # ABI gate: `@moxxy/companion-sdk` is a published surface, so a symbol
      # must not leave it by accident. `/ui` is a wildcard re-export, which makes
      # deleting a shared component a silent break for external modules.
      - run: pnpm sdk:surface

      # `minimal` is core + workspace, the two required modules. If the shell
      # compiles against it, it compiles against every profile, so this is the
      # regression guard for "the shell depends on no optional module".
      - run: pnpm gen:modules --profile minimal
      - run: pnpm -r typecheck

  # The Docker image is the deployment path, and nothing above exercises it.
  # A rename of the CLI package once made `pnpm --filter` match nothing, which
  # exits 0, so the image built empty and failed three steps later on a COPY.
  # Every workspace check still passed. This job is that gap closed: it builds
  # the image the way a deploy does, then asks the running container what it
  # actually contains.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the full image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: PROFILE=full
          load: true
          tags: companion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that produces an image which cannot boot is not a passing build.
      - name: Boot it and check the module set
        run: |
          docker run -d --name companion-ci -p 8901:8901 \
            -e COMPANION_ADMIN_USER=ci -e COMPANION_ADMIN_PASSWORD='CorrectHorse1!' companion:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8901/healthz >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8901/healthz >/dev/null || { docker logs companion-ci; exit 1; }
          # `companion` must be on PATH: every runbook in the README uses it.
          docker exec companion-ci companion module list | tee /tmp/modules.txt
          grep -q '13 enabled' /tmp/modules.txt || {
            echo "expected a full build (13 modules); the PROFILE build arg did not take effect"
            exit 1
          }

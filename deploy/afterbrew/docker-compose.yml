# The afterbrew deployment of Companion. Not upstream's root `docker-compose.yml`.
#
# A separate file rather than an edit, so upstream's compose keeps merging cleanly
# and every divergence below is visible as a divergence rather than as a conflict.
#
#   docker compose -f deploy/afterbrew/docker-compose.yml up -d
#
# Upstream's file is already hardened - read-only root, no capabilities, no new
# privileges, password auth - so this changes three things and inherits the rest.
#
# 1. The image is a TAG WE BUILT from this fork, not `build:`. The fork carries
#    safety patches (the merge refusal) that upstream's published image does not,
#    and a `build:` in the deployment file means the running bytes depend on
#    whatever the checkout happened to be.
#
# 2. The port binds 127.0.0.1. Upstream publishes 8901 on every interface, which
#    on a host that also faces a tunnel is a control plane on the LAN.
#
# 3. No credential has a default, and none is written here. The first admin comes
#    from the one-time bootstrap token inside the volume.
services:
  companion:
    container_name: companion
    image: ${COMPANION_IMAGE:?set COMPANION_IMAGE to a tag built from this fork}
    restart: unless-stopped
    networks:
      - default
      - octopus
    depends_on:
      companion-init:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    ports:
      # Loopback only. Reached through an SSH tunnel or a Cloudflare tunnel
      # pointed at this port, never from the LAN.
      - "127.0.0.1:${COMPANION_PORT:-8901}:8901"
    env_file:
      - path: .env
        required: false
    environment:
      - COMPANION_HOME=/data
      - COMPANION_HOST=0.0.0.0
      - COMPANION_PORT=8901
      # Fails closed even if /data once came from a trusted-local run.
      - COMPANION_AUTH_MODE=password
      # moxxy installs provider plugins from npm at runtime and re-verifies them
      # when a session boots. npm's default cache is ~/.npm, which cannot be
      # created under a read-only root -- only /data, the moxxy home and /tmp are
      # writable. Without this the plugin installs, persists to the moxxy volume,
      # and every subsequent session still fails with `mkdir /home/node/.npm`.
      #
      # The cache is throwaway, so tmpfs is the right home for it; the plugins
      # themselves land in the persistent moxxy volume.
      - NPM_CONFIG_CACHE=/tmp/.npm
      # Provider credentials, by name only: the value comes from .env, is read by
      # the DAEMON, and is not the same as an agent child picking up a stray
      # variable.
      #
      # ZAI_API_KEY and ZAI_CODING_PLAN_API_KEY are the same key under two names,
      # and the difference matters. The first is what companiond.json's
      # `zai-coding` provider declares via apiKeyEnv; the second is what moxxy's
      # `zai-coding-plan` provider looks for when an agent run needs a model.
      # `moxxy provision` cannot store the second: its slug list still advertises
      # `zai-plan`, which the plugin does not register -- it ships `zai` and
      # `zai-coding-plan`.
      - MINIMAX_API_KEY
      - ZAI_API_KEY
      - ZAI_CODING_PLAN_API_KEY
      - DEEPSEEK_API_KEY
      # moxxy's agent runtime has no MiniMax or DeepSeek plugin -- its registry
      # offers anthropic, claude-code, google, local, openai, openai-codex, xai
      # and zai. Both are OpenAI-compatible, so they ride the `openai` provider,
      # which takes ONE base URL. MiniMax gets it: it is a subscription, so a
      # fallback that fires costs nothing, where DeepSeek is metered.
      #
      # DeepSeek is still reachable through the model-router module, which can
      # hold all three at once. The asymmetry is the plugin registry's, not ours.
      #
      # It reaches MiniMax through `minimax-proxy` rather than directly. MiniMax
      # reasons inline unless the request carries `thinking: {"type":
      # "disabled"}`, and it IGNORES `reasoning_effort` -- the only reasoning
      # control the openai plugin can send. Unproxied, the model returns a
      # `<think>` block inside `message.content`, that message replays into the
      # next request, and MiniMax answers 400 (2013): every agent run dies right
      # after its first tool call, while one-shots with no tool call succeed.
      - OPENAI_BASE_URL=http://minimax-proxy:8080/v1
      - OPENAI_API_KEY=${MINIMAX_API_KEY:?set MINIMAX_API_KEY}
    volumes:
      - companion-data:/data
      # moxxy's home holds the provider credentials. Companion's isolated home
      # under /data symlinks to it, so losing this volume loses every provider.
      - companion-moxxy:/home/node/.moxxy
    healthcheck:
      # /healthz, not /api/health -- there is no such route and the container sat
      # `health: starting` forever while the application was serving fine.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8901/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s

  # Repairs ownership of the two persisted roots, then exits. Root and two
  # capabilities for a finite job; the long-running service stays uid 1000 with
  # none. Same image, so it cannot drift from what it is preparing.
  # Adds the one request field MiniMax needs and the openai plugin cannot send.
  # Nothing else is rewritten; responses are piped so streaming still streams.
  minimax-proxy:
    image: node:22-alpine
    container_name: minimax-proxy
    restart: unless-stopped
    command: ["node", "/app/minimax-proxy.mjs"]
    volumes:
      - ./minimax-proxy.mjs:/app/minimax-proxy.mjs:ro
    environment:
      - PROXY_PORT=8080
      - UPSTREAM_BASE_URL=https://api.minimax.io
    # Never published to the host: it forwards a credential-bearing request and
    # has no authentication of its own. Only the compose network reaches it.
    expose:
      - "8080"

  companion-init:
    container_name: companion-init
    image: ${COMPANION_IMAGE:?set COMPANION_IMAGE to a tag built from this fork}
    user: "0:0"
    entrypoint:
      - /usr/local/bin/init-volumes.sh
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    volumes:
      - companion-data:/data
      - companion-moxxy:/home/node/.moxxy

# Explicit names, so the volumes do not move when the compose project does.
# Compose derives a volume's real name from the project, which is the directory
# this file sits in -- relocating the deployment would otherwise create empty
# volumes beside the full ones and start with no database and no provider vault.
volumes:
  companion-data:
    name: companion-afterbrew_companion-data
  companion-moxxy:
    name: companion-afterbrew_companion-moxxy

networks:
  default:
    name: companion_default
  # Octopus reviews the pull requests this lane opens, and Companion starts
  # that review over Octopus's own API rather than by labelling the PR. Its
  # public hostname sits behind an access proxy that expects credentials
  # Companion does not carry, so the two are joined on Octopus's own network
  # and the adapter is pointed at the service name. External: this compose
  # file does not own that network and must not recreate it.
  octopus:
    external: true
    name: octopus_default

services:
  companion:
    build:
      context: .
      args:
        # Which modules the image contains; see profiles/*.json.
        PROFILE: ${COMPANION_PROFILE:-slim}
        # Unset means the newest moxxy at build time. Set it to hold an image on
        # a known one, for instance while a moxxy release is being qualified.
        MOXXY_VERSION: ${MOXXY_VERSION:-latest}
        # false skips the moxxy CLI entirely. Use it with PROFILE=cloud, whose
        # built-in runtime is a subprocess of this bundle: that image runs agent
        # work with nothing installed and nobody signed in on the box.
        INSTALL_MOXXY: ${INSTALL_MOXXY:-true}
    image: companion:local
    restart: unless-stopped
    ports:
      - "8901:8901"
    env_file:
      # Optional — Coolify and friends inject env through their own UI instead.
      - path: .env
        required: false
    environment:
      COMPANION_HOME: /data
      COMPANION_HOST: 0.0.0.0
      COMPANION_PORT: 8901
    volumes:
      - companion-data:/data
      # moxxy's daily home holds the provider credentials (vault). Companion's
      # isolated home under /data symlinks to it, so this MUST persist too —
      # otherwise every redeploy wipes the vault and moxxy loses its providers
      # ("no credentials" / "No active provider").
      - companion-moxxy:/root/.moxxy
      # Optional: mount your host SSH config if private Git remotes should use SSH.
      # - ~/.ssh:/root/.ssh:ro

volumes:
  companion-data:
  companion-moxxy:
